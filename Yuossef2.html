<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yuossef2</title>
    <link rel="stylesheet" href="Yuossef2.css">
    <!-- ربط مكتبة Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    </head>
    <body>
    <div class="wrapper">
        <div class="form-box login">
            <h2>تسجيل الدخول</h2>
            <form action="#">
                <div class="input-box">
                    <span class="icon"><i class="fas fa-envelope"></i></span>
                    <input type="email" required placeholder="البريد الإلكتروني">
                </div>
                <div class="input-box">
                    <span class="icon"><i class="fas fa-lock"></i></span>
                    <input type="password" required placeholder="كلمة المرور">
                </div>
                <div class="forgot-pass">
                    <a href="#">هل نسيت كلمة المرور؟</a>
                </div>
                <button type="submit">دخول</button>
                <div class="register-link">
                    <p>ليس لديك حساب؟ <a href="#">سجل الآن</a></p>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
